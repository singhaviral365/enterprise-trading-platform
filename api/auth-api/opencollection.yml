opencollection: 1.0.0

info:
  name: auth-api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: req.setUrl(`{{base_url}}/${req.url}`)
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
