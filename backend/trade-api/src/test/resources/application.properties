spring.application.name=backend

# Server
server.port=8080

# PostgreSQL Test Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities

# JWT Secret (test value)
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-testing

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
trading.kafka.orders-topic=orders
trading.kafka.source=trade-api
trading.kafka.schema-version=1

# Logging
logging.level.org.mybatis=WARN
logging.level.org.springframework.jdbc=WARN
