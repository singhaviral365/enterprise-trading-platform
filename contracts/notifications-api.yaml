openapi: 3.1.0

info:
  title: Notifications API (Trade REST API module, served by order-service)
  version: 1.0.0
  summary: A customer's in-app notification inbox.
  description: |
    The customer-facing half of the Customer Notifications module: the inbox the Angular bell reads. The module
    is a package inside the Trade REST API (`services/order-service`), with its own routes, tables and README.

    What it does and does not expose:

    * **What produces a notification.** Order outcomes (`ORDER_FILLED`, `ORDER_REJECTED`, `ORDER_CANCELLED`) read
      from `trade-events` in a consumer group of its own, and watchlist price alerts handed over in-process by
      the watchlist module. **There is no route that creates a notification.** The in-process delivery interface
      is deliberately not an HTTP endpoint: publishing it would let a customer send themselves anything.
    * **Which channel.** Resolved from Customer Preferences on every send, never from a constant, and recorded on
      the notification (`channels`). A notification is shown in the inbox only when `IN_APP` is among them.
      Email goes to the address held for the account and is development-only; see the module README.
    * **Idempotency.** A notification is keyed by the event that caused it, so a replayed event produces nothing
      new.

    ## Authorisation

    Every route requires a valid signed JWT (`AUTH-401` otherwise) and checks that the account in the token owns
    the account in the path:

    * the path account is unknown: `ACC-404`, 404
    * the path account belongs to someone else: `ACC-403`, 403
    * the notification id exists but belongs to another account: `NTF-404`, 404, the same answer as an id that
      does not exist, so ids in use are not revealed

    ## What the inbox shows

    Unread notifications, newest first, plus notifications read **within the last hour** (so a message the
    customer just opened does not vanish under their cursor). A notification read more than an hour ago is no
    longer listed. Nothing is deleted: it stays in the database with its `readAt`.
  contact:
    name: Team 3
  license:
    name: Instructional use only

servers:
  - url: http://localhost:8081
    description: Local development, run from Docker Compose
  - url: http://trade-api:8080
    description: Service name inside the Docker Compose network

tags:
  - name: Notifications
    description: Reading the inbox and marking a notification read.

security:
  - bearerAuth: []

paths:

  /api/v1/accounts/{accountId}/notifications:
    parameters:
      - $ref: '#/components/parameters/AccountId'

    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the account's inbox
      description: |
        Newest first. `q` matches the title and the message (case-insensitive substring; `%` and `_` are
        literal). `category` may repeat to select several categories.
      parameters:
        - name: q
          in: query
          required: false
          description: Text to look for in the title or message.
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          required: false
          description: Only these categories. Repeat the parameter for several. Omit for all.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/NotificationCategory'
        - name: page
          in: query
          required: false
          description: Zero-based page.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: One page of the inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/v1/accounts/{accountId}/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 42

    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark a notification read
      description: 'Idempotent: marking a notification that is already read leaves its original `readAt`.'
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          description: No such account, or no such notification on this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notification:
                  value:
                    errorCode: NTF-404
                    message: Notification not found

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: The numeric account key. Must be the account the token belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    AccountNotReachable:
      description: The token is valid but its account does not own the account in the path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: ACC-403
                message: Account not reachable with this token
    AccountNotFound:
      description: No account exists with that key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: ACC-404
                message: Account not found
    Invalid:
      description: A query parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input

  schemas:

    NotificationCategory:
      type: string
      enum: [ORDER_STATUS, WATCHLIST_ALERTS, STRATEGY_EXECUTION]
      description: |
        `ORDER_STATUS`: an order the customer placed was filled, rejected or cancelled. `WATCHLIST_ALERTS`: a price alert fired.
        `STRATEGY_EXECUTION`: an order one of the customer's automated strategies placed was filled, rejected or cancelled,
        or a strategy was stopped after repeated failures or expired. Worded differently from `ORDER_STATUS` ("Strategy #12
        bought 50 AAPL ..."), so the customer can tell the platform acted for them. The same three categories the customer
        chooses between in Settings.

    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, SMS]
      description: A channel the notification was routed to, as resolved from Customer Preferences at send time.

    Notification:
      type: object
      additionalProperties: false
      required: [notificationId, category, title, message, createdAt, channels]
      properties:
        notificationId:
          type: integer
          format: int64
          example: 42
        category:
          $ref: '#/components/schemas/NotificationCategory'
        title:
          type: string
          example: Order filled
        message:
          type: string
          description: Plain text. Never carries a credential or anything the event contract prohibits.
          example: Your buy order for 10 AAPL was filled at 189.50.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
          description: When the customer read it. Null while unread.
        channels:
          type: array
          description: The channels resolved from the customer's preferences when it was sent.
          items:
            $ref: '#/components/schemas/NotificationChannel'

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalItems:
          type: integer
          format: int64
          description: How many notifications match the filters (all pages).
          example: 23
        totalPages:
          type: integer
          example: 3
        unreadCount:
          type: integer
          format: int64
          description: Unread notifications for the account, regardless of the filters. Drives the bell badge.
          example: 5

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The platform's single error envelope. Clients branch on `errorCode`, never on `message`.
        The notifications module adds one code to the platform catalogue because nothing in it fits.
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, ACC-403, ACC-404, VAL-422, NTF-404]
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `AUTH-401` | 401 | Unauthorised or invalid token |
            | `ACC-403` | 403 | Account not reachable with this token |
            | `ACC-404` | 404 | Account not found |
            | `VAL-422` | 422 | Invalid input |
            | `NTF-404` | 404 | Notification not found (or not this account's) |
          example: NTF-404
        message:
          type: string
          description: Short description for a human. Never a stack trace, SQL fragment or internal identifier.
          example: Notification not found
