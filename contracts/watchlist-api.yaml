openapi: 3.1.0

info:
  title: Watchlist API (Trade REST API module, served by order-service)
  version: 1.0.0
  summary: Customer watchlists with a live price beside each instrument.
  description: |
    The watchlist half of the "Watchlists and price alerts" extension. It is a module inside the
    Trade REST API (`services/order-service`), in its own package, and its routes are served by the same service on 8080.
    Each watchlist entry can carry **one price alert** (see "Price alerts" below).

    ## Authorisation

    Every route requires a valid signed JWT. A missing, malformed, expired or wrongly signed token
    is `AUTH-401`, 401. The verifier cannot decide whether this caller may reach this resource, so
    every route also checks that the account in the token owns the account in the path:

    * the path account is unknown: `ACC-404`, 404
    * the path account belongs to someone else: `ACC-403`, 403
    * the watchlist id exists but belongs to another account: `WTL-404`, 404, the same answer as an
      id that does not exist, so ids in use are not revealed

    The account is always taken from the verified token. Nothing in a request body can widen it.

    ## Live prices

    Each item carries the latest price the module has received from the `market-data` topic. The
    executor-service's poller publishes every watched instrument to that topic, and the Trade REST API
    consumes it in a group of its own, keeping the latest quote per symbol in memory. Prices are
    never stored in a database and are not part of the watchlist itself. `priceStatus` says how much
    to trust `price`:

    | `priceStatus` | Meaning |
    |---|---|
    | `LIVE` | A quote newer than the staleness threshold (default 300 s) is held |
    | `STALE` | A quote is held but is older than the threshold; `price` is the last known value |
    | `UNAVAILABLE` | No quote has been received for the symbol yet; `price` and `quotedAt` are null |

    The poller publishes about once a minute, so polling this API faster than that shows no change.

    ## Price alerts

    An alert is a **direction** (`ABOVE` or `BELOW`) and a **target price** set on one watchlist entry. It is
    never both: a customer who wants both sets one on each of two entries, or sets the other later.

    * **What "crossed" means.** `ABOVE` fires on the first quote at or over the target; `BELOW` on the first
      quote at or under it. Creating an alert whose target the latest known price has already reached is
      refused with `ALR-409`, so an alert never fires the moment it is created. If no price is known yet
      (`UNAVAILABLE`) the alert is accepted and judged against the next quote.
    * **What happens next: it fires once.** The alert becomes `TRIGGERED`, keeps the price that crossed it,
      and stays visible. It does **not** fire again on later quotes; the customer sets a new alert on the entry
      to re-arm it (setting one replaces the old). Firing on every quote past the level would send a customer
      dozens of messages in a minute through a module somebody else owns.
    * **Delivery.** A fired alert is handed in-process to Customer Notifications, which resolves the
      customer's channel from their preferences. This module never chooses a channel. `delivery` says how the
      hand-over went: `PENDING` (not yet handed over), `HANDED_OVER` (notifications accepted it) or `FAILED`
      (notifications raised; the hand-over is retried a bounded number of times, then stays `FAILED` and
      visible). An alert is never lost silently and never fires twice: the state change is one guarded
      statement, and notifications ignores a repeated hand-over of the same alert.
    * **Cap.** An account may hold a bounded number of **active** alerts (default 20, configuration
      `watchlist.limits.max-alerts-per-account`). Going over is `ALR-422`. The count and the write are one
      statement, so concurrent requests cannot both slip past it.
    * **Lookup.** The market-data consumer decides per quote whether any customer cares with an in-memory
      index keyed by symbol (O(1) miss); the database is touched only when a quote actually crosses a level.

    ## Limits

    An account may hold a bounded number of watchlists, and a watchlist a bounded number of
    instruments. Defaults are 10 and 50, set by configuration. Going over is `WTL-422` or
    `WLI-422`, 422.

    A watchlist entry is not a position. Any tradable instrument may be added, whether or not the
    customer has ever held it.
  contact:
    name: Team 3
  license:
    name: Instructional use only

servers:
  - url: http://localhost:8081
    description: Local development, run from Docker Compose
  - url: http://trade-api:8080
    description: Service name inside the Docker Compose network

tags:
  - name: Watchlists
    description: Creating, listing, renaming and deleting watchlists.
  - name: Watchlist items
    description: Adding and removing instruments on a watchlist.
  - name: Price alerts
    description: A target price and a direction on a watchlist entry, delivered through Customer Notifications.

security:
  - bearerAuth: []

paths:

  /api/v1/accounts/{accountId}/watchlists:
    parameters:
      - $ref: '#/components/parameters/AccountId'

    get:
      operationId: listWatchlists
      tags: [Watchlists]
      summary: List the account's watchlists with their instruments and latest prices
      responses:
        '200':
          description: Every watchlist the account owns, oldest first. An empty array if there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          $ref: '#/components/responses/AccountNotFound'

    post:
      operationId: createWatchlist
      tags: [Watchlists]
      summary: Create a watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: The new, empty watchlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/NameConflict'
        '422':
          $ref: '#/components/responses/InvalidOrOverLimit'

  /api/v1/accounts/{accountId}/watchlists/{watchlistId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WatchlistId'

    patch:
      operationId: renameWatchlist
      tags: [Watchlists]
      summary: Rename a watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: The renamed watchlist with its instruments and latest prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          $ref: '#/components/responses/WatchlistOrAccountNotFound'
        '409':
          $ref: '#/components/responses/NameConflict'
        '422':
          $ref: '#/components/responses/InvalidOrOverLimit'

    delete:
      operationId: deleteWatchlist
      tags: [Watchlists]
      summary: Delete a watchlist and everything on it
      responses:
        '200':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          $ref: '#/components/responses/WatchlistOrAccountNotFound'

  /api/v1/accounts/{accountId}/watchlists/{watchlistId}/items:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WatchlistId'

    post:
      operationId: addWatchlistItem
      tags: [Watchlist items]
      summary: Add an instrument to a watchlist
      description: |
        The symbol is matched ignoring case and stored in the instrument's canonical form. The
        instrument must exist and be tradable; the customer need not hold it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '200':
          description: The watchlist after the addition, each item with its latest price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          description: Account, watchlist or instrument not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                instrument:
                  value:
                    errorCode: INS-404
                    message: Instrument not found
        '409':
          description: The instrument is already on this watchlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    errorCode: WLI-409
                    message: Stock is already in the watchlist
        '422':
          $ref: '#/components/responses/InvalidOrOverLimit'

  /api/v1/accounts/{accountId}/watchlists/{watchlistId}/items/{tickerSymbol}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WatchlistId'
      - name: tickerSymbol
        in: path
        required: true
        description: The instrument's ticker, matched ignoring case.
        schema:
          type: string
          maxLength: 20
        example: AAPL

    delete:
      operationId: removeWatchlistItem
      tags: [Watchlist items]
      summary: Remove an instrument from a watchlist
      responses:
        '200':
          description: The watchlist after the removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          description: Account, watchlist or item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                item:
                  value:
                    errorCode: WLI-404
                    message: Stock not found in watchlist

  /api/v1/accounts/{accountId}/watchlists/{watchlistId}/items/{tickerSymbol}/alert:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WatchlistId'
      - name: tickerSymbol
        in: path
        required: true
        description: The instrument's ticker, matched ignoring case. Must already be on the watchlist.
        schema:
          type: string
          maxLength: 20
        example: AAPL

    put:
      operationId: setPriceAlert
      tags: [Price alerts]
      summary: Set (or replace) the price alert on a watchlist entry
      description: |
        Arms an alert on the entry. An existing alert, active or already triggered, is replaced, which is how
        a fired alert is re-armed. Replacing an active alert does not count against the cap twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAlertRequest'
      responses:
        '200':
          description: The watchlist after the change, with the alert on its entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          description: Account, watchlist or entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                item:
                  value:
                    errorCode: WLI-404
                    message: Stock not found in watchlist
        '409':
          description: The latest known price has already reached the target, so the alert would fire at once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reached:
                  value:
                    errorCode: ALR-409
                    message: The target has already been reached
        '422':
          description: The request failed validation, or the account is at its active-alert limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    errorCode: VAL-422
                    message: Invalid input
                alertLimit:
                  value:
                    errorCode: ALR-422
                    message: Price alert limit reached

    delete:
      operationId: clearPriceAlert
      tags: [Price alerts]
      summary: Remove the price alert from a watchlist entry
      description: Works on an active or a triggered alert. The entry stays on the watchlist.
      responses:
        '200':
          description: The watchlist after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AccountNotReachable'
        '404':
          description: Account, watchlist or entry not found, or the entry has no alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noAlert:
                  value:
                    errorCode: ALR-404
                    message: No price alert on this stock

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: The numeric account key. Must be the account the token belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 9

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorised:
              value:
                errorCode: AUTH-401
                message: Unauthorised
    AccountNotReachable:
      description: The token is valid but its account does not own the account in the path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: ACC-403
                message: Account not reachable with this token
    AccountNotFound:
      description: No account exists with that key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: ACC-404
                message: Account not found
    WatchlistOrAccountNotFound:
      description: |
        No such account, or no such watchlist on this account. A watchlist owned by another
        account gets the same answer as one that does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            watchlist:
              value:
                errorCode: WTL-404
                message: Watchlist not found
    NameConflict:
      description: The account already has a watchlist with this name (compared ignoring case).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                errorCode: WTL-409
                message: Watchlist with this name already exists
    InvalidOrOverLimit:
      description: The request failed validation, or the account is at its limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                errorCode: VAL-422
                message: Invalid input
            watchlistLimit:
              value:
                errorCode: WTL-422
                message: Watchlist limit reached
            itemLimit:
              value:
                errorCode: WLI-422
                message: Watchlist item limit reached

  schemas:

    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Surrounding whitespace is trimmed. Must not be blank.
          example: Tech stocks

    AddItemRequest:
      type: object
      additionalProperties: false
      required: [tickerSymbol]
      properties:
        tickerSymbol:
          type: string
          minLength: 1
          maxLength: 20
          example: AAPL

    PriceStatus:
      type: string
      enum: [LIVE, STALE, UNAVAILABLE]

    AlertDirection:
      type: string
      enum: [ABOVE, BELOW]
      description: '`ABOVE` fires when the price rises to the target; `BELOW` when it falls to it.'

    AlertStatus:
      type: string
      enum: [ACTIVE, TRIGGERED]
      description: '`ACTIVE` is armed. `TRIGGERED` has fired once and will not fire again unless replaced.'

    AlertDelivery:
      type: string
      enum: [PENDING, HANDED_OVER, FAILED]
      description: |
        How the hand-over to Customer Notifications went, for a triggered alert. `FAILED` means notifications
        raised; the hand-over is retried a bounded number of times.

    SetAlertRequest:
      type: object
      additionalProperties: false
      required: [direction, targetPrice]
      properties:
        direction:
          $ref: '#/components/schemas/AlertDirection'
        targetPrice:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          description: In the same unit as the entry's `price`. Up to 4 decimal places.
          example: 200.5

    PriceAlert:
      type: object
      additionalProperties: false
      required: [direction, targetPrice, status, setAt]
      properties:
        direction:
          $ref: '#/components/schemas/AlertDirection'
        targetPrice:
          type: number
          example: 200.5
        status:
          $ref: '#/components/schemas/AlertStatus'
        setAt:
          type: string
          format: date-time
        triggeredAt:
          type: [string, 'null']
          format: date-time
          description: When the alert fired. Null while `ACTIVE`.
        triggerPrice:
          type: [number, 'null']
          description: The quote that crossed the target. Null while `ACTIVE`.
        delivery:
          oneOf:
            - $ref: '#/components/schemas/AlertDelivery'
            - type: 'null'
          description: Null while `ACTIVE`.

    WatchlistItem:
      type: object
      additionalProperties: false
      required: [tickerSymbol, addedAt, priceStatus]
      properties:
        tickerSymbol:
          type: string
          example: AAPL
        addedAt:
          type: string
          format: date-time
        price:
          type: [number, 'null']
          description: Latest known price. Null when `priceStatus` is `UNAVAILABLE`.
          example: 189.5
        quotedAt:
          type: [string, 'null']
          format: date-time
          description: When that price was quoted. Null when `priceStatus` is `UNAVAILABLE`.
        priceStatus:
          $ref: '#/components/schemas/PriceStatus'
        alert:
          oneOf:
            - $ref: '#/components/schemas/PriceAlert'
            - type: 'null'
          description: The entry's price alert, or null if none is set.

    Watchlist:
      type: object
      additionalProperties: false
      required: [watchlistId, accountId, name, createdAt, updatedAt, items]
      properties:
        watchlistId:
          type: integer
          format: int64
          example: 9
        accountId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Tech stocks
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Ordered by ticker.
          items:
            $ref: '#/components/schemas/WatchlistItem'

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      description: |
        The platform's single error envelope. Clients branch on `errorCode`, never on `message`.
        The watchlist module adds codes to the platform catalogue because nothing in it fits.
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, ACC-403, ACC-404, INS-404, VAL-422, WTL-404, WTL-409, WTL-422, WLI-404, WLI-409, WLI-422, ALR-404, ALR-409, ALR-422]
          description: |
            | Code | HTTP | Meaning |
            |---|---|---|
            | `AUTH-401` | 401 | Unauthorised or invalid token |
            | `ACC-403` | 403 | Account not reachable with this token |
            | `ACC-404` | 404 | Account not found |
            | `INS-404` | 404 | Instrument not found or not tradable |
            | `VAL-422` | 422 | Invalid input |
            | `WTL-404` | 404 | Watchlist not found (or not this account's) |
            | `WTL-409` | 409 | Watchlist name already used on this account |
            | `WTL-422` | 422 | Account is at its watchlist limit |
            | `WLI-404` | 404 | Instrument not on this watchlist |
            | `WLI-409` | 409 | Instrument already on this watchlist |
            | `WLI-422` | 422 | Watchlist is at its item limit |
            | `ALR-404` | 404 | No price alert on this instrument |
            | `ALR-409` | 409 | The target has already been reached at the latest price |
            | `ALR-422` | 422 | Account is at its active price-alert limit |
          example: WTL-404
        message:
          type: string
          description: Short description for a human. Never a stack trace, SQL fragment or internal identifier.
          example: Watchlist not found
