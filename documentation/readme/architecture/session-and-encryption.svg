<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" role="img" aria-labelledby="t d"><title id="t">Sign-in, session cookies and payload encryption</title><desc id="d">Sequence of a sign-in with two-step verification: the browser fetches the auth-service public key, sends the credentials in a JWE envelope, receives a sealed challenge, verifies the emailed code, and gets two HttpOnly cookies. Later calls to the order-service carry the access cookie and a CSRF header; a 401 triggers one refresh with the refresh cookie.</desc><defs><marker id="a52606d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52606d"/></marker><marker id="s52606d" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,1 L1,5 L10,9 z" fill="#52606d"/></marker><marker id="a2f6f73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f6f73"/></marker><marker id="s2f6f73" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,1 L1,5 L10,9 z" fill="#2f6f73"/></marker><marker id="a323f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#323f4b"/></marker><marker id="s323f4b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,1 L1,5 L10,9 z" fill="#323f4b"/></marker><marker id="aa4452c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a4452c"/></marker><marker id="sa4452c" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,1 L1,5 L10,9 z" fill="#a4452c"/></marker></defs><rect width="1500" height="960" fill="#f8f6f1"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2933" text-anchor="start">Sign-in, session cookies and payload encryption</text><text x="40" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">One sign-in with two-step verification (on by default), then an ordinary call and a renewal</text><rect x="80" y="92" width="260" height="52" rx="6" fill="#e8eef3" stroke="#323f4b" stroke-width="1.4"/><text x="94" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">Browser (Angular app)</text><rect x="510" y="92" width="260" height="52" rx="6" fill="#f1e7df" stroke="#323f4b" stroke-width="1.4"/><text x="524" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">auth-service :3000</text><rect x="940" y="92" width="260" height="52" rx="6" fill="#e4eee6" stroke="#323f4b" stroke-width="1.4"/><text x="954" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">order-service :8081</text><polyline points="210,144 210,905" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="3 5" stroke-linejoin="round"/><polyline points="640,144 640,905" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="3 5" stroke-linejoin="round"/><polyline points="1070,144 1070,905" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="3 5" stroke-linejoin="round"/><polyline points="210,190 640,190" fill="none" stroke="#323f4b" stroke-width="1.5" marker-end="url(#a323f4b)" stroke-linejoin="round"/><rect x="337.3" y="169" width="175.3" height="17" fill="#f8f6f1"/><text x="425.0" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle">GET /.well-known/jwks.json</text><rect x="258.8" y="196" width="332.5" height="16" fill="#f8f6f1"/><text x="425.0" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">public RSA key and its id (404 while encryption is off)</text><polyline points="640,232 210,232" fill="none" stroke="#323f4b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a323f4b)" stroke-linejoin="round"/><polyline points="210,290 640,290" fill="none" stroke="#a4452c" stroke-width="1.5" marker-end="url(#aa4452c)" stroke-linejoin="round"/><rect x="327.7" y="269" width="194.7" height="17" fill="#f8f6f1"/><text x="425.0" y="282" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#a4452c" text-anchor="middle">POST /auth/login   (JWE body)</text><rect x="244.0" y="296" width="362.0" height="16" fill="#f8f6f1"/><text x="425.0" y="308" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">RSA-OAEP-256 + A256GCM, header: iat, jti, htm, htu, epk_resp</text><rect x="654" y="276" width="380" height="82" rx="5" fill="#fbf3d9" stroke="#c9b87a" stroke-width="1"/><text x="664" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start">auth-service opens the envelope</text><text x="664" y="314" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">key id, method and path must match this request</text><text x="664" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">issued within 60 s, jti never seen before</text><text x="664" y="346" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">password checked with Argon2id, login throttled</text><polyline points="640,405 210,405" fill="none" stroke="#a4452c" stroke-width="1.5" marker-end="url(#aa4452c)" stroke-linejoin="round"/><rect x="224.7" y="384" width="400.6" height="17" fill="#f8f6f1"/><text x="425.0" y="397" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#a4452c" text-anchor="middle">JWE(ECDH-ES to the page's key): twoFactorRequired + challenge</text><rect x="320.7" y="411" width="208.6" height="16" fill="#f8f6f1"/><text x="425.0" y="423" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">only this page can open the answer</text><rect x="654" y="392" width="380" height="66" rx="5" fill="#fbf3d9" stroke="#c9b87a" stroke-width="1"/><text x="664" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start">code emailed</text><text x="664" y="430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">6-digit code to the address on the login;</text><text x="664" y="446" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">stored hashed, 5 wrong guesses kill it, 300 s life</text><polyline points="210,500 640,500" fill="none" stroke="#a4452c" stroke-width="1.5" marker-end="url(#aa4452c)" stroke-linejoin="round"/><rect x="305.1" y="479" width="239.7" height="17" fill="#f8f6f1"/><text x="425.0" y="492" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#a4452c" text-anchor="middle">POST /auth/login/verify   (JWE body)</text><rect x="359.1" y="506" width="131.9" height="16" fill="#f8f6f1"/><text x="425.0" y="518" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">{ challengeId, code }</text><polyline points="640,585 210,585" fill="none" stroke="#a4452c" stroke-width="1.5" marker-end="url(#aa4452c)" stroke-linejoin="round"/><rect x="308.4" y="564" width="233.3" height="17" fill="#f8f6f1"/><text x="425.0" y="577" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#a4452c" text-anchor="middle">JWE answer + two Set-Cookie headers</text><rect x="232" y="600" width="440" height="66" rx="5" fill="#fbf3d9" stroke="#c9b87a" stroke-width="1"/><text x="242" y="620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start">what the browser stores</text><text x="242" y="638" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">access_token   HttpOnly, SameSite=Strict, Path=/, 15 minutes</text><text x="242" y="654" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">refresh_token  HttpOnly, SameSite=Strict, Path=/auth, 7 days</text><polyline points="210,715 1070,715" fill="none" stroke="#323f4b" stroke-width="1.5" marker-end="url(#a323f4b)" stroke-linejoin="round"/><rect x="516.9" y="694" width="246.1" height="17" fill="#f8f6f1"/><text x="640.0" y="707" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle">GET or POST /api/v1/accounts/{id}/...</text><rect x="473.8" y="721" width="332.5" height="16" fill="#f8f6f1"/><text x="640.0" y="733" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Cookie: access_token   X-Requested-With: XMLHttpRequest</text><rect x="1084" y="700" width="380" height="98" rx="5" fill="#fbf3d9" stroke="#c9b87a" stroke-width="1"/><text x="1094" y="720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start">order-service checks</text><text x="1094" y="738" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">HS256 signature, issuer, expiry (shared secret)</text><text x="1094" y="754" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">user id from the claims only, never the request</text><text x="1094" y="770" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">the account must belong to that user (ACC-403)</text><text x="1094" y="786" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">a cookie-only change needs the CSRF header</text><polyline points="1070,805 210,805" fill="none" stroke="#323f4b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a323f4b)" stroke-linejoin="round"/><rect x="555.5" y="784" width="168.9" height="17" fill="#f8f6f1"/><text x="640.0" y="797" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle">JSON answer (plain today)</text><polyline points="210,860 640,860" fill="none" stroke="#323f4b" stroke-width="1.5" marker-end="url(#a323f4b)" stroke-linejoin="round"/><rect x="282.6" y="839" width="284.8" height="17" fill="#f8f6f1"/><text x="425.0" y="852" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle">401 or about to expire:  POST /auth/refresh</text><rect x="196.8" y="866" width="456.4" height="16" fill="#f8f6f1"/><text x="425.0" y="878" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">refresh cookie only, no body; the old token is revoked and a new pair is set</text><rect x="1130" y="150" width="340" height="196" rx="6" fill="#ffffff" stroke="#323f4b" stroke-width="1.4"/><text x="1144" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">The envelope</text><text x="1144" y="198" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">standard</text><text x="1230" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">JWE, compact serialisation (jose)</text><text x="1144" y="223" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">request</text><text x="1230" y="223" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">RSA-OAEP-256 key wrap, A256GCM</text><text x="1144" y="248" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">answer</text><text x="1230" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">ECDH-ES to the page's own key</text><text x="1144" y="273" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">bound to</text><text x="1230" y="273" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">method, path, time, one-time id</text><text x="1144" y="298" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">key</text><text x="1230" y="298" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">RSA 3072, private half in application.yml</text><text x="1144" y="323" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', monospace" font-size="12" font-weight="400" fill="#a4452c" text-anchor="start">mode</text><text x="1230" y="323" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">off | optional | required</text><rect x="1130" y="366" width="340" height="134" rx="6" fill="#ffffff" stroke="#323f4b" stroke-width="1.4"/><text x="1144" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">Why cookies, not storage</text><text x="1144" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">A script cannot read an HttpOnly cookie, so a</text><text x="1144" y="430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">script bug cannot copy the session out.</text><text x="1144" y="448" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">The page keeps only the username and the</text><text x="1144" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">expiry time. The refresh cookie never travels</text><text x="1144" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">to the trading APIs (Path=/auth).</text><rect x="1130" y="520" width="340" height="106" rx="6" fill="#f5e6e1" stroke="#323f4b" stroke-width="1.4"/><text x="1144" y="544" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">What is not covered</text><text x="1144" y="566" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">The order and executor services still use</text><text x="1144" y="584" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">plain JSON over HTTP behind the cookie.</text><text x="1144" y="602" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Encryption protects the auth-service,</text><text x="1144" y="620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">where passwords and codes travel.</text></svg>