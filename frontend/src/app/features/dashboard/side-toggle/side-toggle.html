<fieldset class="segmented side-toggle" [class.is-sell]="side() === 'SELL'">
  <legend class="visually-hidden">Order side</legend>
  <span class="segment-thumb" aria-hidden="true"></span>
  <label class="segment" [class.is-active]="side() === 'BUY'">
    <input type="radio" name="order-side" value="BUY" data-testid="order-side-buy" [checked]="side() === 'BUY'" (change)="side.set('BUY')" />
    <i class="fas fa-circle-plus" aria-hidden="true"></i>
    Buy
  </label>
  <label class="segment" [class.is-active]="side() === 'SELL'">
    <input type="radio" name="order-side" value="SELL" data-testid="order-side-sell" [checked]="side() === 'SELL'" (change)="side.set('SELL')" />
    <i class="fas fa-circle-minus" aria-hidden="true"></i>
    Sell
  </label>
</fieldset>
