<ul class="position-grid" [class.is-compact]="compact()" data-testid="positions-card-view">
  @for (row of rows(); track row.symbol) {
    <li>
      <button
        type="button"
        class="card is-lift position-card"
        [class.is-selected]="row.symbol === selectedSymbol()"
        [attr.aria-current]="row.symbol === selectedSymbol() ? 'true' : null"
        data-testid="position-card"
        [attr.aria-label]="'View ' + row.symbol + ', ' + row.name + ', position details'"
        (click)="selected.emit(row)"
      >
        <span class="position-card-top">
          <app-instrument-label
            class="position-card-head"
            [symbol]="row.symbol"
            [name]="row.name"
            [iconUrl]="row.iconUrl"
            [size]="40"
          />
          @if (row.pricing; as pricing) {
            @if (!compact()) {
              <app-price-status
                [status]="pricing.status"
                [asOf]="pricing.priceAsOf"
                [attr.data-testid]="'holding-status-' + row.symbol"
              />
            }
          }
        </span>
        @if (!compact()) {
        <span class="position-card-basis">
          @if (row.pricing?.marketValue !== null && row.pricing?.marketValue !== undefined) {
            <span class="position-basis-label">Market value</span>
            <span class="position-basis-value" [attr.data-testid]="'holding-value-' + row.symbol" [attr.title]="(row.pricing?.marketValue ?? row.costBasis) | currency: currency() ?? 'USD'">{{
              row.pricing!.marketValue | compactMoney: currency() ?? 'USD'
            }}</span>
          } @else {
            <span class="position-basis-label">Cost basis</span>
            <span class="position-basis-value" [attr.data-testid]="'holding-value-' + row.symbol" [attr.title]="(row.pricing?.marketValue ?? row.costBasis) | currency: currency() ?? 'USD'">{{
              row.costBasis | compactMoney: currency() ?? 'USD'
            }}</span>
          }
        </span>
        @if (row.pricing; as pricing) {
          <dl class="position-card-figures">
            <div>
              <dt>Unrealised</dt>
              <dd><app-pnl-value [amount]="pricing.unrealisedPnl" [percent]="pricing.unrealisedPercent" [currency]="currency() ?? 'USD'" /></dd>
            </div>
            <div>
              <dt>Today</dt>
              <dd><app-pnl-value [amount]="pricing.dayPnl" [percent]="pricing.dayPnlPercent" [currency]="currency() ?? 'USD'" /></dd>
            </div>
          </dl>
        }
        <span class="position-card-qty">
          {{ row.quantity | number }} @if (row.pricing?.lastPrice != null) { × {{ row.pricing!.lastPrice | currency: currency() ?? 'USD' }} }
        </span>
        }
      </button>
    </li>
  }
</ul>
