<header class="app-header">
  <div class="header-left">
    @if (session.isLoggedIn()) {
      <app-tooltip position="right" text="Toggle sidebar">
        <button
          type="button"
          class="btn is-primary is-icon-only"
          aria-label="Toggle sidebar"
          aria-controls="app-sidebar"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="toggleSidebar.emit()"
        >
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
      </app-tooltip>
    } @else {
      <app-tooltip position="bottom" text="Go to home page">
        <a class="btn is-primary is-icon-only" routerLink="/" aria-label="Go to home page">
          <i class="fas fa-home" aria-hidden="true"></i>
        </a>
      </app-tooltip>
    }

    <a routerLink="/" class="header-logo">Trading Platform</a>
  </div>

  <div class="header-right">
    <app-tooltip position="bottom" [text]="theme.isDark() ? 'Light mode' : 'Dark mode'">
      <button
        type="button"
        class="btn is-primary is-icon-only"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle()"
      >
        <i class="fas" [class.fa-sun]="theme.isDark()" [class.fa-moon]="!theme.isDark()" aria-hidden="true"></i>
      </button>
    </app-tooltip>

    @if (session.isLoggedIn()) {
      <app-tooltip position="bottom" text="Logout">
        <button type="button" class="btn is-icon-only is-error" aria-label="Logout" (click)="logout()">
          <i class="fas fa-power-off" aria-hidden="true"></i>
        </button>
      </app-tooltip>
    }
  </div>
</header>
