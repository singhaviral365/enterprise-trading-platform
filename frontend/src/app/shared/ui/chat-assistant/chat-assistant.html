@if (open()) {
  <section
    id="chat-assistant-panel"
    class="assistant-panel"
    role="dialog"
    aria-labelledby="chat-assistant-title"
    data-testid="chat-assistant-panel"
  >
    <header class="assistant-header">
      <h2 id="chat-assistant-title" class="assistant-title">
        <i class="fas fa-robot" aria-hidden="true"></i>
        Assistant
      </h2>
      <button
        type="button"
        class="btn is-secondary is-icon-only is-small"
        aria-label="Close assistant"
        data-testid="chat-assistant-close"
        (click)="close()"
      >
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </header>
    <p class="assistant-message" data-testid="chat-assistant-message">
      The assistant is not connected yet, so there is nobody to answer here for now.
    </p>
    <p class="form-hint">
      You can turn this icon off any time in <a routerLink="/settings" (click)="close()">Settings</a>.
    </p>
  </section>
}

<button
  #trigger
  type="button"
  class="btn is-primary is-icon-only assistant-trigger"
  aria-label="Open assistant"
  aria-haspopup="dialog"
  aria-controls="chat-assistant-panel"
  [attr.aria-expanded]="open()"
  data-testid="chat-assistant-button"
  (click)="toggle()"
>
  <i class="fas" [class.fa-comments]="!open()" [class.fa-xmark]="open()" aria-hidden="true"></i>
</button>
