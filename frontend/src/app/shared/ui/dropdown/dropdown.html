@if (label()) {
  <label class="form-label" [for]="inputId()">{{ label() }}</label>
}
<select
  class="form-select"
  [id]="inputId()"
  [class.is-error]="invalid()"
  [disabled]="disabled()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="invalid() && errorText() ? inputId() + '-error' : null"
  (change)="onChange($event)"
>
  @if (placeholder()) {
    <option value="" disabled [selected]="value() === ''">{{ placeholder() }}</option>
  }
  @for (option of options(); track option.value) {
    <option [value]="option.value" [disabled]="option.disabled ?? false" [selected]="option.value === value()">
      {{ option.label }}
    </option>
  }
</select>
@if (invalid() && errorText()) {
  <p class="form-error-text" [id]="inputId() + '-error'">{{ errorText() }}</p>
}
