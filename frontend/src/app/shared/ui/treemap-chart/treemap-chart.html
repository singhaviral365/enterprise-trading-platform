<div class="treemap-chart hc" data-testid="treemap-chart">
  <div class="hc-frame" [style.--hc-height]="height() + 'px'">
    <div #plot class="hc-plot" role="img" [attr.aria-label]="ariaLabel()"></div>
  </div>

  <details class="chart-table" data-testid="treemap-chart-table">
    <summary>View as table</summary>
    <div class="table-container">
      <table class="data-table is-compact">
        <caption class="visually-hidden">{{ ariaLabel() }}</caption>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col" class="is-numeric">{{ valueName() }}</th>
            <th scope="col" class="is-numeric">{{ changeName() }}</th>
          </tr>
        </thead>
        <tbody>
          @for (item of items(); track item.name) {
            <tr>
              <th scope="row">{{ item.name }}</th>
              <td class="is-numeric">{{ valueFormatter()(item.value) }}</td>
              <td class="is-numeric">{{ formatChange(item.change) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </details>
</div>
