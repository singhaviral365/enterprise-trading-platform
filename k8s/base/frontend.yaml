# Angular static site on nginx. API endpoints are baked into the production image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: etp-frontend
          ports:
            - { name: http, containerPort: 80 }
          envFrom:
            - configMapRef: { name: etp-urls }
          volumeMounts:
            - { name: nginx-template, mountPath: /etc/nginx/templates, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: nginx-template
          configMap: { name: frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  default.conf.template: |
    # Frontend nginx for Kubernetes. Replaces the image's own template, whose `resolver 127.0.0.11` (Docker's DNS)
    # does not exist in a pod. The browser only ever talks to the frontend load balancer: the session is HttpOnly
    # cookies, which a browser keeps per hostname, so the auth and trade calls must share the page's hostname.
    # Same routes as docker-compose: /_auth/* -> auth-service, /_order/* -> order-service, /api/v1/market -> executor,
    # /api/* -> order-service. Service names resolve through the pod's resolv.conf at start (ClusterIPs never change).
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }

    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_min_length 1024;
      gzip_types text/css application/javascript application/json image/svg+xml;
      client_max_body_size 20m;

      # Plain-http fix: browsers only expose crypto.randomUUID on https/localhost, and the order ticket calls it,
      # so on http the Buy/Sell panel crashes (white box). Add it to the page from crypto.getRandomValues, which
      # works on http. Remove once the site is served over https. (No dollar signs: nginx would expand them.)
      sub_filter '</head>' '<script>if(window.crypto&&typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;var h=Array.from(b,function(x){return (x+256).toString(16).slice(1)}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script></head>';
      sub_filter_once on;

      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket and server-sent events (live price streams)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;

      # /_auth/x -> auth-service /x. A cookie scoped to /auth reaches the browser as /_auth/auth.
      location ^~ /_auth/ {
        proxy_pass http://auth-service:3000/;
        proxy_cookie_path ~^/(.+)$ /_auth/$1;
      }

      # /_order/x -> order-service /x
      location ^~ /_order/ {
        proxy_pass http://order-service:8081/;
        proxy_cookie_path ~^/(.+)$ /_order/$1;
      }

      # Path kept: market data lives on the executor, the rest of /api on the order-service.
      location ^~ /api/v1/market {
        proxy_pass http://executor-service:8082;
      }
      location ^~ /api/ {
        proxy_pass http://order-service:8081;
      }

      # Single-page app: unknown paths get index.html and the app routes them.
      location / {
        try_files $uri $uri/ /index.html;
      }

      location ~* \.(?:js|mjs|css|html|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
      }

      location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
      }
    }
