apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storageclass.yaml
  - kafka.yaml
  - kafka-topics-job.yaml
  - auth-service.yaml
  - order-service.yaml
  - executor-service.yaml
  - frontend.yaml
configMapGenerator:
  - name: etp-config
    envs: [config.env]
  - name: etp-shared-config            # the project's Config/application.yml (copy it into base/generated/ first - guide step 7.2)
    files: [application.yml=generated/application.yml]
secretGenerator:
  - name: etp-secrets
    envs: [secrets.env]                # your secrets (copy of k8s/secrets.env)
images:
  - name: etp-auth-service
    newName: 631237958288.dkr.ecr.ap-south-1.amazonaws.com/etp-auth-service
    newTag: '1.9'
  - name: etp-order-service
    newName: 631237958288.dkr.ecr.ap-south-1.amazonaws.com/etp-order-service
    newTag: '1.9'
  - name: etp-executor-service
    newName: 631237958288.dkr.ecr.ap-south-1.amazonaws.com/etp-executor-service
    newTag: '1.9'
  - name: etp-frontend
    newName: 631237958288.dkr.ecr.ap-south-1.amazonaws.com/etp-frontend
    newTag: '1.9'
    # newTag: 052769d
