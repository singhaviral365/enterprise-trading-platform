# Every value comes from config/application.yml. `node config/cli.js compose-env` writes services/.env (ports, database login, kafka) for the
# ${VARIABLES} below, and the two application services mount the file itself (CONFIG_FILE), so they read their own settings from it.
# Only what differs inside the docker network (host names of the database and Kafka) is set here.
services:
  postgres:
    image: postgres:16-alpine
    profiles: [platform]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${TRADING_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    profiles: [platform]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST}:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkQrQXtsTmyQ1mLvSstIngQ
    ports:
      - "${KAFKA_PORT}:9092"
    networks:
      - trading-net
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    profiles: [platform]
    entrypoint: bash
    command: /kafka-scripts/create-topics.sh
    depends_on:
      kafka:
        condition: service_started
    networks:
      - trading-net
    volumes:
      - ../infra/kafka/create-topics.sh:/kafka-scripts/create-topics.sh

  auth-db:
    image: postgres:16-alpine
    profiles: [platform]
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    profiles: [platform]
    container_name: auth-service
    environment:
      # Everything else (port, secrets, email, encryption, cookies) is read from the mounted application.yml.
      CONFIG_FILE: /config/application.yml
      DATABASE_HOST: auth-db
      DATABASE_PORT: 5432
    volumes:
      - ../config/application.yml:/config/application.yml:ro
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_PORT}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  backend:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      args:
        CORE_JAVA_REPO_URL: ${CORE_JAVA_REPO_URL}
        CORE_JAVA_REF: ${CORE_JAVA_REF:-core-java}
    profiles: [platform]
    environment:
      CONFIG_FILE: /config/application.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Email is off unless config/application.yml sets order.email.mode (dev or prod); the profile of that name is activated here.
      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-}
    volumes:
      - ../config/application.yml:/config/application.yml:ro
    ports:
      - "${ORDER_PORT}:${ORDER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${ORDER_PORT}/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  auth-db-data:
    driver: local
