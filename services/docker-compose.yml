services:
  postgres:
    image: postgres:16-alpine
    profiles: [platform]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    profiles: [platform]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkQrQXtsTmyQ1mLvSstIngQ
    ports:
      - "9092:9092"
    networks:
      - trading-net
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    profiles: [platform]
    entrypoint: bash
    command: /kafka-scripts/create-topics.sh
    depends_on:
      kafka:
        condition: service_started
    networks:
      - trading-net
    volumes:
      - ../infra/kafka/create-topics.sh:/kafka-scripts/create-topics.sh

  auth-db:
    image: postgres:16-alpine
    profiles: [platform]
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trading-net
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    profiles: [platform]
    container_name: auth-service
    environment:
      # Set AUTH_NODE_ENV=development to send the sign-in code through a local SMTP catcher (MailHog, run on the host, not
      # in this compose file); production refuses to send mail.
      NODE_ENV: ${AUTH_NODE_ENV:-production}
      PORT: 3000
      DATABASE_HOST: auth-db
      DATABASE_PORT: 5432
      DATABASE_NAME: auth_db
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: auth-service
      # Session cookies. NODE_ENV=production makes them Secure by default, which a plain-http compose setup cannot
      # use (browsers only exempt http://localhost); set AUTH_COOKIE_SECURE=true once you serve over https.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Registration, two-step sign-in and forgot password email a code. Email is DEVELOPMENT ONLY and the service refuses to
      # start with it on under NODE_ENV=production or with a non-local SMTP host. So this stack, which is production-like by
      # default, runs with the registration email check and two-step sign-in OFF unless you opt in for development:
      #   AUTH_NODE_ENV=development  AUTH_EMAIL_ENABLED=true  AUTH_EMAIL_VERIFICATION_ENABLED=true  AUTH_TWO_FACTOR_ENABLED=true
      #   (and MailHog running on your machine)
      AUTH_EMAIL_VERIFICATION_ENABLED: ${AUTH_EMAIL_VERIFICATION_ENABLED:-false}
      AUTH_TWO_FACTOR_ENABLED: ${AUTH_TWO_FACTOR_ENABLED:-false}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-false}
      AUTH_EMAIL_SMTP_HOST: ${AUTH_EMAIL_SMTP_HOST:-localhost}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-strict}
      JWT_ACCESS_TOKEN_EXPIRES_IN: 900
      JWT_REFRESH_TOKEN_EXPIRES_IN: 604800
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  backend:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      args:
        CORE_JAVA_REPO_URL: ${CORE_JAVA_REPO_URL}
        CORE_JAVA_REF: ${CORE_JAVA_REF:-core-java}
    profiles: [platform]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://v6.exchangerate-api.com/v6}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      # The signals module explains a signal with Gemini when a key is set (documentation/readme/SIGNALS.md); without one the
      # platform's own wording is used and nothing is sent anywhere.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_RATE_LIMIT_RPM: ${GEMINI_RATE_LIMIT_RPM:-60}
      CANDLE_CACHE_TTL_MINUTES: ${CANDLE_CACHE_TTL_MINUTES:-10}
      SIGNAL_CACHE_TTL_MINUTES: ${SIGNAL_CACHE_TTL_MINUTES:-5}
      # The Portfolio module prices holdings with its own batched Fauxnance client (the browser never calls Fauxnance).
      # Without these the portfolio routes answer MKT-503 and nothing else is affected.
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Email is development-only and off unless BOTH of these are set (see documentation/readme/NOTIFICATIONS.md):
      #   BACKEND_SPRING_PROFILES_ACTIVE=dev   NOTIFICATIONS_EMAIL_SMTP_HOST=localhost
      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-}
      NOTIFICATIONS_EMAIL_SMTP_HOST: ${NOTIFICATIONS_EMAIL_SMTP_HOST:-localhost}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  auth-db-data:
    driver: local
