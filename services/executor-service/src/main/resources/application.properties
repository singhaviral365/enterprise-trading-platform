spring.application.name=executor-service

server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# MyBatis
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

trading.kafka.orders-topic=orders
trading.kafka.orders-consumer-group=executor-service
trading.kafka.trades-topic=trade-events
trading.kafka.market-data-topic=market-data
trading.kafka.execution-source=executor-service
trading.kafka.schema-version=1
trading.kafka.consumer.retry.initial-interval-millis=100
trading.kafka.consumer.retry.multiplier=2.0
trading.kafka.consumer.retry.max-interval-millis=1000
trading.kafka.consumer.retry.max-attempts=3

# Executor
trading.executor.max-settlement-attempts=3
trading.market-data.poll-interval-seconds=${POLL_INTERVAL_SECONDS:60}
trading.market-data.watch-symbols=${MARKET_DATA_WATCH_SYMBOLS:}

# Fauxnance quote client
trading.quote.base-url=${FAUXNANCE_BASE_URL}
trading.quote.api-key=${FAUXNANCE_API_KEY}
trading.quote.max-attempts=3
trading.quote.retry-delay-millis=100
trading.quote.request-timeout-millis=1000

# Exchange rates (ExchangeRate-API, called from here only; the browser never calls it).
# EXCHANGE_RATE_API_URL is the base without the key, e.g. https://v6.exchangerate-api.com/v6
trading.fx.base-url=${EXCHANGE_RATE_API_URL}
trading.fx.api-key=${EXCHANGE_RATE_API_KEY}
trading.fx.base-currency=USD
trading.fx.cache-ttl-minutes=180
trading.fx.request-timeout-millis=3000

# Logging
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG