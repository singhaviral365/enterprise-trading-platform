spring.application.name=executor-service
# The working directory is the service folder (maven, IntelliJ's default) or the repository root; CONFIG_FILE points anywhere else.
spring.config.import=optional:file:../../config/application.example.yml,optional:file:./config/application.yml,optional:file:../../config/application.yml,optional:file:${CONFIG_FILE:../../config/application.yml}

server.port=${services.executor.port}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${database.trading.host}:${database.trading.port}/${database.trading.name}
spring.datasource.username=${database.trading.user}
spring.datasource.password=${database.trading.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# MyBatis
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities

# Kafka
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

trading.kafka.orders-topic=orders
trading.kafka.orders-consumer-group=executor-service
trading.kafka.trades-topic=trade-events
trading.kafka.market-data-topic=market-data
trading.kafka.execution-source=executor-service
trading.kafka.schema-version=1
trading.kafka.consumer.retry.initial-interval-millis=100
trading.kafka.consumer.retry.multiplier=2.0
trading.kafka.consumer.retry.max-interval-millis=1000
trading.kafka.consumer.retry.max-attempts=3

# Executor
trading.executor.max-settlement-attempts=3
trading.market-data.poll-interval-seconds=${executor.poll-interval-seconds}
trading.market-data.watch-symbols=${executor.watch-symbols}

# Fauxnance quote client
trading.quote.base-url=${external.fauxnance.base-url}
trading.quote.api-key=${external.fauxnance.api-key}
trading.quote.max-attempts=3
trading.quote.retry-delay-millis=100
trading.quote.request-timeout-millis=1000

# Exchange rates (ExchangeRate-API, called from here only; the browser never calls it).
# EXCHANGE_RATE_API_URL is the base without the key, e.g. https://v6.exchangerate-api.com/v6
trading.fx.base-url=${external.exchange-rate.base-url}
trading.fx.api-key=${external.exchange-rate.api-key}
trading.fx.base-currency=USD
trading.fx.cache-ttl-minutes=180
trading.fx.request-timeout-millis=3000

# Automated strategies (see documentation/readme/STRATEGIES.md). The worker reads market-data in a group of its own and places
# a strategy's order through the order-service's POST /api/v1/orders, never through Kafka or the database.
# KILL SWITCH: STRATEGY_EXECUTION_ENABLED=false claims and places nothing (restart to change).
strategy.execution.enabled=${executor.strategy-execution-enabled}
strategy.execution.max-quote-age-seconds=180
strategy.execution.claim-timeout-seconds=120
strategy.kafka.consumer-group=strategy-worker
# A new group starts at the end of the topic: a worker that was just deployed never acts on a backlog of old prices.
strategy.kafka.consumer.start-from=latest
strategy.kafka.consumer.enabled=true
strategy.sweeper.interval-millis=15000
strategy.order-api.base-url=http://${services.order.host}:${services.order.port}
strategy.order-api.connect-timeout-millis=2000
strategy.order-api.request-timeout-millis=5000
# The order token is signed with the same secret and issuer the order-service verifies the Auth service's tokens with.
strategy.token.secret=${jwt.secret}
strategy.token.issuer=${jwt.issuer}
strategy.token.ttl-seconds=60
# Development profile only: hold the claim this long before the order is sent, to show a strategy being switched off mid-run.
strategy.demo.pre-order-delay-millis=${executor.strategy-demo-delay-millis}

# Logging
logging.level.org.mybatis=WARN
logging.level.org.springframework.jdbc=WARN