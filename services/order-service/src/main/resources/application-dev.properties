# Development profile: SPRING_PROFILES_ACTIVE=dev (or run-app.ps1 -Dev). Nothing in here applies to any other environment.

# Email goes to MailHog, a local SMTP catcher: nothing leaves the machine. Read what was "sent" at http://localhost:8025.
# Start it with:  docker compose --profile dev-mail up -d mailhog   (from services/)
# DevOnlyEmailGuard refuses to start the application if this is enabled without the dev/local profile or with a
# host other than localhost or mailhog.
notifications.email.enabled=true
notifications.email.smtp.host=localhost
notifications.email.smtp.port=1025
