# Development profile: SPRING_PROFILES_ACTIVE=dev (or run-app.ps1 -Dev). Nothing in here applies to any other environment.

# Email goes to MailHog, a local SMTP catcher: nothing leaves the machine. Read what was "sent" at http://localhost:8025.
# Run MailHog on your machine (it listens on 1025, web UI on 8025); it is not part of docker-compose.
# EmailEnvironmentGuard refuses to start the application if the dev profile is combined with a host other than localhost, mailhog
# or host.docker.internal (dev mail never goes to a real server).
notifications.email.enabled=true
notifications.email.smtp.host=${services.mailhog.host}
notifications.email.smtp.port=${services.mailhog.smtp-port}

# Metrics (signals.candle.*, signals.gemini.*, ...) are readable at /actuator/metrics on a development machine only. Nothing here
# applies to any other environment, where only the health endpoint is exposed.
management.endpoints.web.exposure.include=health,metrics
