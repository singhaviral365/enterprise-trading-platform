# Production profile (order.email.mode: prod in config/application.yml; run-app.ps1 turns that into this profile). Nothing in here applies to any other environment.

# Email goes to a real provider over TLS. Every value comes from order.email.* in config/application.yml, and the application refuses
# to start if one is missing or unsafe (EmailEnvironmentGuard).
notifications.email.enabled=true
notifications.email.smtp.host=${order.email.smtp.host}
notifications.email.smtp.port=${order.email.smtp.port}
notifications.email.smtp.tls=${order.email.smtp.tls}
notifications.email.smtp.username=${order.email.smtp.username}
notifications.email.smtp.password=${order.email.smtp.password}
notifications.email.from=${order.email.from}
notifications.email.from-domains=${order.email.from-domains}
notifications.email.reply-to=${order.email.reply-to}
notifications.email.allowed-recipient-domains=${order.email.allowed-recipient-domains}
notifications.email.dispatch.max-per-minute=${order.email.max-per-minute}
