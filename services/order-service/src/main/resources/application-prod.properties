# Production profile: SPRING_PROFILES_ACTIVE=prod. Nothing in here applies to any other environment.

# Email goes to a real provider over TLS. The host, the login and the sending domain are NOT in this file: set them in the
# environment (or a secret store), and the application refuses to start if any is missing (EmailEnvironmentGuard):
#   NOTIFICATIONS_EMAIL_SMTP_HOST, NOTIFICATIONS_EMAIL_SMTP_USERNAME, NOTIFICATIONS_EMAIL_SMTP_PASSWORD,
#   NOTIFICATIONS_EMAIL_FROM, NOTIFICATIONS_EMAIL_FROM_DOMAINS
# Optional: NOTIFICATIONS_EMAIL_REPLY_TO, NOTIFICATIONS_EMAIL_ALLOWED_RECIPIENT_DOMAINS (a comma list; leave empty for real customers).
notifications.email.enabled=true
notifications.email.smtp.host=${NOTIFICATIONS_EMAIL_SMTP_HOST}
notifications.email.smtp.port=${NOTIFICATIONS_EMAIL_SMTP_PORT:587}
notifications.email.smtp.tls=${NOTIFICATIONS_EMAIL_SMTP_TLS:starttls}
notifications.email.smtp.username=${NOTIFICATIONS_EMAIL_SMTP_USERNAME}
notifications.email.smtp.password=${NOTIFICATIONS_EMAIL_SMTP_PASSWORD}
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM}
notifications.email.from-domains=${NOTIFICATIONS_EMAIL_FROM_DOMAINS}
notifications.email.reply-to=${NOTIFICATIONS_EMAIL_REPLY_TO:}
notifications.email.allowed-recipient-domains=${NOTIFICATIONS_EMAIL_ALLOWED_RECIPIENT_DOMAINS:}
# A conservative start under most providers' per-minute quotas; raise it to what the account allows.
notifications.email.dispatch.max-per-minute=${NOTIFICATIONS_EMAIL_MAX_PER_MINUTE:60}
