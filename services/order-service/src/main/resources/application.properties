spring.application.name=order-service

# Load local .env for developer runs (optional; no effect if file is absent)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Server
server.port=8081


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always


# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities


# JWT Secret
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}

#
# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
trading.kafka.orders-topic=orders
trading.kafka.source=order-service
trading.kafka.schema-version=1
#

# Logging
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG