spring.application.name=order-service

# Load local .env for developer runs (optional; no effect if file is absent)
# The working directory is the service folder (maven, IntelliJ's default) or the repository root; CONFIG_FILE points anywhere else.
spring.config.import=optional:file:../../config/application.example.yml,optional:file:./config/application.yml,optional:file:../../config/application.yml,optional:file:${CONFIG_FILE:../../config/application.yml}

# Server
server.port=${services.order.port}


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${database.trading.host}:${database.trading.port}/${database.trading.name}
spring.datasource.username=${database.trading.user}
spring.datasource.password=${database.trading.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:watchlist-schema.sql,classpath:preferences-schema.sql,classpath:notifications-schema.sql,classpath:portfolio-schema.sql,classpath:portfolio-performance-schema.sql,classpath:strategy-schema.sql


# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities


# JWT Secret

#
# Kafka producer
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
trading.kafka.orders-topic=orders
trading.kafka.source=order-service
trading.kafka.schema-version=1
#

# Exchange rates (ExchangeRate-API, called from the backend only). Used to convert a LIMIT price entered in the
# instrument's currency into the account's currency. EXCHANGE_RATE_API_URL is the base without the key.
trading.fx.base-url=${external.exchange-rate.base-url}
trading.fx.api-key=${external.exchange-rate.api-key}
trading.fx.base-currency=USD
trading.fx.cache-ttl-minutes=180
trading.fx.request-timeout-millis=3000
# Watchlist module
# Consumes market-data in a group of its own. Never reuse another service's group id (executor-service, ...).
watchlist.kafka.market-data-topic=market-data
watchlist.kafka.consumer-group=watchlist-prices
watchlist.kafka.consumer.enabled=true
watchlist.kafka.consumer.retry.initial-interval-millis=100
watchlist.kafka.consumer.retry.multiplier=2.0
watchlist.kafka.consumer.retry.max-interval-millis=1000
watchlist.kafka.consumer.retry.max-attempts=3
# Per-account caps, so an unbounded create route cannot fill the tables.
watchlist.limits.max-watchlists-per-account=10
watchlist.limits.max-items-per-watchlist=50
# Prices are held in memory only, never stored. A quote older than this is returned as STALE.
watchlist.price.stale-after-seconds=300
watchlist.price.max-symbols=5000
# Price alerts. One alert per watchlist entry; the cap counts ACTIVE alerts, so a customer cannot arm an unbounded number
# of them and turn the market-data consumer into the thing that takes the service down.
watchlist.limits.max-alerts-per-account=20
# A fired alert whose hand-over to notifications failed is retried this often, at most this many times in total.
watchlist.alerts.redelivery-interval-millis=60000
watchlist.alerts.max-delivery-attempts=3

# Customer notifications module
# Consumes trade-events in a group of its own. Never reuse another service's group id (executor-service, ...).
notifications.kafka.trade-events-topic=trade-events
notifications.kafka.consumer-group=customer-notifications
notifications.kafka.consumer.enabled=true
# A new group starts at the end of the topic: do not announce last month's fills. After its first start it resumes.
notifications.kafka.consumer.start-from=latest
notifications.kafka.consumer.retry.initial-interval-millis=100
notifications.kafka.consumer.retry.multiplier=2.0
notifications.kafka.consumer.retry.max-interval-millis=1000
notifications.kafka.consumer.retry.max-attempts=3
# A notification the customer has read stays listed for this long, then drops out of the bell (it is never deleted).
notifications.inbox.read-retention-minutes=60
# Email is DEVELOPMENT ONLY and off by default, so every other environment sends nothing and records email deliveries
# as SKIPPED. It is switched on by the dev profile (application-dev.properties), and DevOnlyEmailGuard refuses to start
# the application if it is enabled anywhere else.
# Email is OFF unless notifications.email.enabled=true, and then the active profile chooses the mode (see EmailEnvironmentGuard):
# dev = a local catcher (MailHog), prod = a real provider over TLS (application-prod.properties). The defaults below are the
# dev ones; the prod profile overrides them, and its host and credentials come only from environment variables.
notifications.email.enabled=false
notifications.email.from=${order.email.from}
notifications.email.smtp.host=${services.mailhog.host}
notifications.email.smtp.port=${services.mailhog.smtp-port}
notifications.email.smtp.tls=none
# Comma lists. from-domains: the domains notifications.email.from may be on (required in prod). allowed-recipient-domains: mail goes
# only to these domains (required in the staging profile, empty means no restriction in prod).
notifications.email.from-domains=${order.email.from-domains}
notifications.email.allowed-recipient-domains=${order.email.allowed-recipient-domains}
notifications.email.dispatch.interval-millis=5000
notifications.email.dispatch.batch-size=20
notifications.email.dispatch.max-attempts=3

# Automated strategies (see documentation/readme/STRATEGIES.md). The customer-facing side lives here; the executor-service runs
# them. These are the platform's ceilings on what a customer may ask a strategy to do, not defaults for the customer.
strategy.limits.max-open-per-account=20
strategy.limits.max-quantity=1000000
strategy.limits.max-order-value=10000000
strategy.limits.max-position-qty=10000000
strategy.limits.max-window-days=366
# When a customer sends no spending cap, it is quantity x trigger price plus this many percent (rounded up to a whole unit).
strategy.limits.default-buffer-percent=15
# A price older than this is not taken as proof the price was on the safe side of the trigger when a strategy was created.
strategy.limits.arm-fresh-seconds=300
# Strategies that were stopped or expired are announced to their customers this often.
strategy.announce.interval-millis=30000

# Trade signals and the assistant (see documentation/readme/SIGNALS.md). The signals module has its own Fauxnance candle client
# (nothing outside the portfolio module may depend on the portfolio's); only the address and key are shared. The Gemini key is an environment value of this service; without it every explanation is the
# platform's own wording and the chat says the assistant is not set up.
signals.lookback-days=90
signals.fauxnance.base-url=${external.fauxnance.base-url}
signals.fauxnance.api-key=${external.fauxnance.api-key}
signals.fauxnance.request-timeout-millis=5000
signals.candles.cache-ttl-minutes=${signals.candle-cache-ttl-minutes}
signals.candles.max-stale-hours=24
signals.cache-ttl-minutes=${signals.signal-cache-ttl-minutes}
gemini.api-key=${external.gemini.api-key}
gemini.model=${external.gemini.model}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.timeout-millis=20000
gemini.max-output-tokens=400
gemini.rate-limit-rpm=${external.gemini.rate-limit-rpm}
gemini.rate-limit-per-account-rpm=10
gemini.warn-rpm=50

# Logging
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG
# Only signed JWTs from the Auth service are accepted. Never set to true outside tests.
security.dev-tokens.enabled=false

# Portfolio and P&L (see documentation/readme/PORTFOLIO_PLAN.md). The order-service has its own Fauxnance client for
# batched quotes; the browser never calls Fauxnance. Without a key the module answers MKT-503 and nothing else is affected.
portfolio.quote.base-url=${external.fauxnance.base-url}
portfolio.quote.api-key=${external.fauxnance.api-key}
portfolio.quote.request-timeout-millis=3000
portfolio.quote.max-symbols-per-call=25
portfolio.quote.ttl-seconds=30
portfolio.quote.fresh-seconds=300
portfolio.quote.max-stale-hours=24
portfolio.quote.backoff-seconds=60
portfolio.kafka.consumer-group=portfolio-pnl
portfolio.kafka.trade-events-topic=trade-events
portfolio.kafka.consumer.start-from=earliest
portfolio.kafka.consumer.enabled=true
portfolio.reconcile.on-startup=true

# End-of-day statements and the NAV curve. enabled=false switches the nightly job and the performance route off (the route then answers
# PRF-503) without touching the portfolio routes or trading. The job runs nightly (UTC), after the last close, and spends at most
# max-candle-calls-per-run of the shared daily Fauxnance quota; it stops on the first quota error and resumes next run.
portfolio.performance.enabled=true
portfolio.performance.cron=0 30 1 * * *
portfolio.performance.max-candle-calls-per-run=60
portfolio.performance.heal-days=5
portfolio.performance.benchmarks=SPY
