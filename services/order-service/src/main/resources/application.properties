spring.application.name=order-service

# Load local .env for developer runs (optional; no effect if file is absent)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Server
server.port=8081


# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:watchlist-schema.sql,classpath:preferences-schema.sql,classpath:notifications-schema.sql


# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities


# JWT Secret
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}

#
# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
trading.kafka.orders-topic=orders
trading.kafka.source=order-service
trading.kafka.schema-version=1
#

# Exchange rates (ExchangeRate-API, called from the backend only). Used to convert a LIMIT price entered in the
# instrument's currency into the account's currency. EXCHANGE_RATE_API_URL is the base without the key.
trading.fx.base-url=${EXCHANGE_RATE_API_URL:https://v6.exchangerate-api.com/v6}
trading.fx.api-key=${EXCHANGE_RATE_API_KEY:}
trading.fx.base-currency=USD
trading.fx.cache-ttl-minutes=180
trading.fx.request-timeout-millis=3000
# Watchlist module
# Consumes market-data in a group of its own. Never reuse another service's group id (executor-service, ...).
watchlist.kafka.market-data-topic=market-data
watchlist.kafka.consumer-group=watchlist-prices
watchlist.kafka.consumer.enabled=true
watchlist.kafka.consumer.retry.initial-interval-millis=100
watchlist.kafka.consumer.retry.multiplier=2.0
watchlist.kafka.consumer.retry.max-interval-millis=1000
watchlist.kafka.consumer.retry.max-attempts=3
# Per-account caps, so an unbounded create route cannot fill the tables.
watchlist.limits.max-watchlists-per-account=10
watchlist.limits.max-items-per-watchlist=50
# Prices are held in memory only, never stored. A quote older than this is returned as STALE.
watchlist.price.stale-after-seconds=300
watchlist.price.max-symbols=5000
# Price alerts. One alert per watchlist entry; the cap counts ACTIVE alerts, so a customer cannot arm an unbounded number
# of them and turn the market-data consumer into the thing that takes the service down.
watchlist.limits.max-alerts-per-account=20
# A fired alert whose hand-over to notifications failed is retried this often, at most this many times in total.
watchlist.alerts.redelivery-interval-millis=60000
watchlist.alerts.max-delivery-attempts=3

# Customer notifications module
# Consumes trade-events in a group of its own. Never reuse another service's group id (executor-service, ...).
notifications.kafka.trade-events-topic=trade-events
notifications.kafka.consumer-group=customer-notifications
notifications.kafka.consumer.enabled=true
# A new group starts at the end of the topic: do not announce last month's fills. After its first start it resumes.
notifications.kafka.consumer.start-from=latest
notifications.kafka.consumer.retry.initial-interval-millis=100
notifications.kafka.consumer.retry.multiplier=2.0
notifications.kafka.consumer.retry.max-interval-millis=1000
notifications.kafka.consumer.retry.max-attempts=3
# A notification the customer has read stays listed for this long, then drops out of the bell (it is never deleted).
notifications.inbox.read-retention-minutes=60
# Email is DEVELOPMENT ONLY and off by default, so every other environment sends nothing and records email deliveries
# as SKIPPED. It is switched on by the dev profile (application-dev.properties), and DevOnlyEmailGuard refuses to start
# the application if it is enabled anywhere else.
notifications.email.enabled=false
notifications.email.from=noreply@etpteamriya.com
notifications.email.smtp.host=localhost
notifications.email.smtp.port=1025
notifications.email.dispatch.interval-millis=5000
notifications.email.dispatch.batch-size=20
notifications.email.dispatch.max-attempts=3

# Logging
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.jdbc=DEBUG
# Only signed JWTs from the Auth service are accepted. Never set to true outside tests.
security.dev-tokens.enabled=false
