spring.application.name=backend

# Server
server.port=8080

# PostgreSQL Test Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.backend.entities

# JWT Secret (test value)
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-testing

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
trading.kafka.orders-topic=orders
trading.kafka.source=trade-api
trading.kafka.schema-version=1

# Logging
logging.level.org.mybatis=WARN
logging.level.org.springframework.jdbc=WARN

# Unsigned dev-user-N / dev-account-N tokens are only for tests; production must leave this false.
security.dev-tokens.enabled=true
# Watchlist module: do not start the market-data consumer in tests that boot the full context
watchlist.kafka.consumer.enabled=false

# Values the code no longer defaults in Java (the real ones come from config/application.yml)
trading.fx.base-url=http://localhost:0/fx
signals.candles.cache-ttl-minutes=10
signals.cache-ttl-minutes=5
gemini.api-key=
gemini.model=test-model
gemini.base-url=http://localhost:0
gemini.rate-limit-rpm=60
notifications.email.smtp.host=localhost
notifications.email.from=noreply@example.test
