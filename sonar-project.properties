# One SonarQube project for the whole platform: the Angular app, the auth-service (TypeScript) and the two Spring services (Java).
# Run it with scripts/sonar-scan.ps1 (tests with coverage first, then the scan). See documentation/readme/SONARQUBE.md.
#
# The server address and the token are NOT here: they come from config/application.yml (sonar.host-url, sonar.token) through the script.
#
# Each part is a module of its own, so the coverage files each tool writes (paths relative to that part) are found without rewriting them.

sonar.projectKey=enterprise-trading-platform
sonar.projectName=Enterprise Trading Platform
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.modules=frontend,auth-service,order-service,executor-service

# ---- frontend (Angular, Vitest): coverage/frontend/lcov.info comes from `npm run test:ci`
frontend.sonar.projectName=Frontend
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src/app
frontend.sonar.tests=src/app
frontend.sonar.test.inclusions=**/*.spec.ts
frontend.sonar.exclusions=**/*.spec.ts,src/app/api/generated/**,src/app/showcase/**,src/app/testing/**
frontend.sonar.coverage.exclusions=src/app/api/generated/**,src/app/showcase/**,src/app/testing/**,**/*.spec.ts
frontend.sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# ---- auth-service (NestJS, Jest): coverage/lcov.info comes from `npx jest --coverage`
auth-service.sonar.projectName=Auth service
auth-service.sonar.projectBaseDir=services/auth-service
auth-service.sonar.sources=src
auth-service.sonar.tests=src,test
auth-service.sonar.test.inclusions=**/*.spec.ts,test/**
auth-service.sonar.exclusions=**/*.spec.ts,src/migrations/**
auth-service.sonar.coverage.exclusions=**/*.spec.ts,src/main.ts,**/*.module.ts,**/*.entity.ts,**/dto/**,src/migrations/**
auth-service.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---- order-service (Spring Boot, JaCoCo): target/site/jacoco/jacoco.xml comes from `mvnw clean verify`
order-service.sonar.projectName=Order service
order-service.sonar.projectBaseDir=services/order-service
order-service.sonar.sources=src/main
order-service.sonar.tests=src/test
order-service.sonar.java.binaries=target/classes
order-service.sonar.java.test.binaries=target/test-classes
order-service.sonar.java.source=21
order-service.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ---- executor-service (Spring Boot, JaCoCo)
executor-service.sonar.projectName=Executor service
executor-service.sonar.projectBaseDir=services/executor-service
executor-service.sonar.sources=src/main
executor-service.sonar.tests=src/test
executor-service.sonar.java.binaries=target/classes
executor-service.sonar.java.test.binaries=target/test-classes
executor-service.sonar.java.source=21
executor-service.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
